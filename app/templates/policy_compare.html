{% extends "base.html" %}
{% block content %}
<div class="surface actions"><a class="btn secondary" href="/policies">Back</a></div>
<section class="surface">
  <form method="get" class="actions">
    <label>Compare from
      <select name="left_id">
        {% for version in versions %}<option value="{{ version.id }}" {% if version.id == left.id %}selected{% endif %}>{{ version.version }} — {{ version.status }}</option>{% endfor %}
      </select>
    </label>
    <label>to
      <select name="right_id">
        {% for version in versions %}<option value="{{ version.id }}" {% if version.id == right.id %}selected{% endif %}>{{ version.version }} — {{ version.status }}</option>{% endfor %}
      </select>
    </label>
    <button class="btn primary" type="submit">Compare</button>
  </form>
</section>
<section class="surface">
  <div class="stats-grid">
    {% for version in versions %}<div class="stat-card"><div class="label">Version {{ version.version }}</div><div class="value">{{ signed_counts.get(version.id, 0) }}</div><div class="help">signed documents</div></div>{% endfor %}
  </div>
</section>
<section class="surface diff-table">
  {{ diff_html|safe }}
</section>
{% endblock %}
