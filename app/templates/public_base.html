<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title or brand.app_name }}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <a class="skip-link" href="#public-main">Skip to content</a>
  <div class="public-shell">
    <header class="public-header">
      <div class="inner">
        <a href="/" class="brand-row public-brand-row">
          <div class="brand-mark" aria-hidden="true">C</div>
          <div>
            <div class="kicker">CDIPD Workspace</div>
            <div class="brand public-brand-title">Asset Management</div>
          </div>
        </a>
        <nav class="public-nav" aria-label="Public navigation">
          <a class="nav-link" href="/">Home</a>
          {% if policy_sample_available %}
          <a class="nav-link" href="/policy/reader">Policy Reader</a>
          {% endif %}
          <a class="btn secondary public-nav-btn" href="/login">Log In</a>
          <button class="btn ghost theme-toggle public-theme-toggle" type="button" data-theme-toggle>
            <span class="header-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path></svg>
            </span>
            <span>Theme: Auto</span>
          </button>
        </nav>
      </div>
    </header>

    <main class="public-main" id="public-main">
      {% block content %}{% endblock %}
    </main>

    <footer class="public-footer">
      <div class="inner">{{ brand.org_name }}</div>
    </footer>
  </div>

  <script>
    window.CDIPD_CSRF_TOKEN = {{ csrf_token|tojson }};
    (function () {
      const key = "cdipd-theme";
      const root = document.body;
      const button = document.querySelector("[data-theme-toggle]");
      const states = ["auto", "light", "night"];
      const apply = (value) => {
        if (value === "auto") {
          root.removeAttribute("data-theme");
        } else {
          root.setAttribute("data-theme", value);
        }
        if (button) {
          const label = value.charAt(0).toUpperCase() + value.slice(1);
          button.textContent = "Theme: " + label;
        }
      };
      let current = localStorage.getItem(key) || "auto";
      apply(current);
      if (button) {
        button.addEventListener("click", function () {
          current = states[(states.indexOf(current) + 1) % states.length];
          localStorage.setItem(key, current);
          apply(current);
        });
      }
      document.querySelectorAll("form").forEach(function (form) {
        const method = (form.getAttribute("method") || "get").toLowerCase();
        if (method !== "get" && !form.querySelector("input[name=csrf_token]")) {
          const csrf = document.createElement("input");
          csrf.type = "hidden";
          csrf.name = "csrf_token";
          csrf.value = window.CDIPD_CSRF_TOKEN || "";
          form.prepend(csrf);
        }
      });
      document.querySelectorAll("[data-password-toggle]").forEach(function (buttonNode) {
        const targetId = buttonNode.getAttribute("data-password-toggle");
        const input = document.getElementById(targetId);
        if (!input) return;
        buttonNode.addEventListener("click", function () {
          const show = input.type === "password";
          input.type = show ? "text" : "password";
          buttonNode.classList.toggle("is-visible", show);
          buttonNode.setAttribute("aria-pressed", show ? "true" : "false");
          buttonNode.setAttribute("aria-label", show ? "Hide password" : "Show password");
        });
      });
    })();
  </script>
</body>
</html>
