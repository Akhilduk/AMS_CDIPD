{% extends "public_base.html" %}
{% set title = "Reset Password - CDIPD Asset Management" %}
{% block content %}
<div class="login-shell">
  <div class="login-card">
    <div class="title">Reset Password</div>
    <div class="subtitle" style="margin-bottom: 1.25rem;">Set a new password for the requested account.</div>

    {% if error %}
    <div style="background: #dc3545; color: white; padding: 0.75rem; border-radius: 4px; margin-bottom: 1rem; text-align: center; font-size: 0.875rem;">
      {{ error }}
    </div>
    {% endif %}

    {% if token %}
    <form method="post" action="/reset-password/{{ token }}">
      <div style="margin-bottom: 1rem;">
        <label style="display: block; margin-bottom: 0.5rem; color: #495057; font-weight: 500; font-size: 0.875rem;">New Password</label>
        <input type="password" name="new_password" minlength="8" required style="width: 100%; padding: 0.75rem; border: 1px solid #ced4da; border-radius: 4px; box-sizing: border-box;">
      </div>
      <div style="margin-bottom: 1.25rem;">
        <label style="display: block; margin-bottom: 0.5rem; color: #495057; font-weight: 500; font-size: 0.875rem;">Confirm Password</label>
        <input type="password" name="confirm_password" minlength="8" required style="width: 100%; padding: 0.75rem; border: 1px solid #ced4da; border-radius: 4px; box-sizing: border-box;">
      </div>
      <button type="submit" style="width: 100%; background: #0a2540; color: white; border: none; padding: 0.75rem; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 1rem;">Reset Password</button>
    </form>
    {% else %}
    <div style="text-align: center;">
      <a href="/forgot-password">Generate a new reset link</a>
    </div>
    {% endif %}
  </div>
</div>
{% endblock %}
